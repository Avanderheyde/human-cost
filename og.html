<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#0d0d0d;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;overflow:hidden;position:relative}
body::before{content:'';position:absolute;inset:0;border:1px solid #2a2a2a;margin:24px}
.content{text-align:center;padding:40px}
.eyebrow{font-size:13px;letter-spacing:0.35em;text-transform:uppercase;color:#c9a84c;margin-bottom:24px}
h1{font-family:'Playfair Display',serif;font-size:96px;font-weight:900;line-height:0.9;color:#e8e4dc;letter-spacing:-0.02em}
h1 em{font-style:italic;color:#e8c97a}
.sub{margin-top:28px;font-size:15px;color:#666;letter-spacing:0.08em;line-height:1.8}
.badge{display:inline-block;margin-top:24px;background:#c9a84c;color:#000;font-size:11px;letter-spacing:0.2em;padding:6px 16px;font-weight:500}
</style></head>
<body>
<div class="content">
  <p class="eyebrow">A Financial Reckoning</p>
  <h1>The Cost of <em>You</em></h1>
  <p class="sub">How much did it cost the world to produce you?<br>Add it up — then compare it to the cost of AI.</p>
  <span class="badge">human-cost.com</span>
</div>
</body></html>
